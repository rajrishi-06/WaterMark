name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Tk and a virtual display
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # xvfb-run gives the GUI tests a display; without one they skip instead.
      - name: Run the test suite
        run: xvfb-run -a python -m pytest --cov=watermark --cov-report=term-missing

      - name: Check the CLI is wired up
        run: |
          watermark --version
          watermark presets
